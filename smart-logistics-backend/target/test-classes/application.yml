server:
  port: 5000

spring:
  application:
    name: smart-logistics-backend-test
  data:
    mongodb:
      uri: mongodb://localhost:27017/test
      database: test
      auto-index-creation: false

app:
  jwt:
    secret: test_jwt_secret_key_for_unit_tests_only_must_be_long_enough_12345!
    expires-in-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  services:
    doc-verify-url: http://localhost:8000
  socket:
    host: 0.0.0.0
    port: 5001

logging:
  level:
    root: WARN
